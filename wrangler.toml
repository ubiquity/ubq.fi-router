name = "ubq-fi-router"
main = "src/worker.ts"
compatibility_date = "2024-10-01"
minify = true
account_id = "5c0228bee348f4cf48829ffe21b61fe9"

# Explicit schemes take precedence over the apps' existing scheme-less routes.
# The app Workers remain the origins, reached through the service bindings below.
routes = [
  { pattern = "*.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "http://ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "https://ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "http://stake.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "https://stake.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "http://xp.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "https://xp.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "http://notifications.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "https://notifications.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "http://demo.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "https://demo.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "http://onboard.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "https://onboard.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "http://card.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "https://card.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "http://keygen.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "https://keygen.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "http://work.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "https://work.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "http://partner.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "https://partner.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "http://pay.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "https://pay.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "http://kv.ubq.fi/*", zone_name = "ubq.fi" },
  { pattern = "https://kv.ubq.fi/*", zone_name = "ubq.fi" },
]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[vars]
# Hosts served by the VPS first, through the DNS-only origin.ubq.fi ingress.
# Other hosts answer 410 service_retired; auth.ubq.fi redirects to Passport.
VPS_ORIGIN_MAP = '{"passport.ubq.fi":"origin.ubq.fi","ai.ubq.fi":"origin.ubq.fi","checkout.ubq.fi":"origin.ubq.fi","health.ubq.fi":"origin.ubq.fi","probe.ubq.fi":"origin.ubq.fi"}'

# Shared front-door middleware; no footer changes required in the app repos.

[[services]]
binding = "APP_UBQ"
service = "ubq-fi"

[[services]]
binding = "APP_STAKE"
service = "stake-ubq-fi"

[[services]]
binding = "APP_XP"
service = "xp-ubq-fi"

[[services]]
binding = "APP_NOTIFICATIONS"
service = "notifications-ubq-fi"

[[services]]
binding = "APP_DEMO"
service = "demo-ubq-fi"

[[services]]
binding = "APP_ONBOARD"
service = "onboard-ubq-fi"

[[services]]
binding = "APP_CARD"
service = "card-ubq-fi"

[[services]]
binding = "APP_KEYGEN"
service = "keygen-ubq-fi"

[[services]]
binding = "APP_WORK"
service = "work-ubq-fi"

[[services]]
binding = "APP_PARTNER"
service = "partner-ubq-fi"

[[services]]
binding = "APP_PAY"
service = "pay-ubq-fi"

[[services]]
binding = "APP_KV"
service = "ubq-kv"
